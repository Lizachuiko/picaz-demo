    <title>Picaz — prototype v1</title>
    <!-- Theme before the first paint (Nov 11): the same resolution as src/lib/theme.ts — ?theme=, else the saved setting
         (picaz-ui → state.theme), else the system — so a dark page never flashes white while the app loads -->
    <script>
      (function () {
        try {
          var q = new URLSearchParams(location.search).get('theme')
          var t = q === 'dark' || q === 'light' || q === 'system' ? q : (JSON.parse(localStorage.getItem('picaz-ui') || '{}').state || {}).theme
          var dark = t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
        } catch (e) {}
      })()
    </script>
    <style>html.dark{--lightningcss-light: ;--lightningcss-dark:initial;color-scheme:dark;background:#0c0d0f}</style>
